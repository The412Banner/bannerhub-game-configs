name: Enrich Steam appids (sidecar)

# SAFETY: This workflow ONLY writes games_steam.json + steam_index.json (new sidecar files).
# It never touches games.json, so the site + BannerHub app are unaffected. Runs separately from
# (and does NOT interfere with) update-games-json.yml.

on:
  push:
    paths:
      - 'configs/**'          # a new game folder appeared -> resolve just the new ones (incremental)
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-resolve ALL games (use after improving normalization/aliases)'
        type: boolean
        default: false

# Serialize runs so two commits don't race each other.
concurrency:
  group: enrich-steam-ids
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Resolve Steam appids (incremental)
        env:
          FORCE_RERESOLVE: ${{ inputs.force && '1' || '0' }}
        run: python3 tools/enrich_steam_ids.py

      - name: Commit sidecars if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games_steam.json steam_index.json
          if git diff --cached --quiet; then
            echo "No changes."; exit 0
          fi
          git commit -m "chore: enrich steam appids [skip ci]"
          # Rebase over any concurrent games.json commit before pushing, so we never clobber it.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
